<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Fetcher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233f7bd9' d='M11 3h2v10l4-4 1.4 1.4L12 16.8 5.6 10.4 7 9l4 4zM5 19h14v2H5z'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --line: #dfe3e8; --text: #1c2128;
      --muted: #5f6b78; --faint: #8a95a1; --accent: #2f6fd1; --accent-ink: #fff;
      --ok: #2f8f4e; --warn: #a77a00; --bad: #c0392b; --star: #d99a00;
      --chip-active: #dce9fb; --chip-active-ink: #1f5bb3; --chip-wait: #fbf1d3; --chip-wait-ink: #7a5a00;
      --chip-ok: #dcf2e3; --chip-ok-ink: #22703c; --chip-bad: #fbe0dc; --chip-bad-ink: #a2301f;
      --chip: #e8ebef; --chip-ink: #4a5561; --shadow: 0 6px 24px rgba(20, 30, 45, .14);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121418; --panel: #191c21; --panel2: #1f2329; --line: #2a2f36; --text: #e4e7ea;
        --muted: #9aa3ad; --faint: #6b747e; --accent: #4d8ae4; --accent-ink: #fff;
        --ok: #5cc27c; --warn: #e0c86a; --bad: #ef8a80; --star: #f2c14e;
        --chip-active: #1e3a5f; --chip-active-ink: #8cbcf7; --chip-wait: #3d3a1e; --chip-wait-ink: #e0c86a;
        --chip-ok: #1c3b26; --chip-ok-ink: #7fdc9c; --chip-bad: #4a2424; --chip-bad-ink: #f3a39b;
        --chip: #2a2f36; --chip-ink: #b9c0c8; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121418; --panel: #191c21; --panel2: #1f2329; --line: #2a2f36; --text: #e4e7ea;
      --muted: #9aa3ad; --faint: #6b747e; --accent: #4d8ae4; --accent-ink: #fff;
      --ok: #5cc27c; --warn: #e0c86a; --bad: #ef8a80; --star: #f2c14e;
      --chip-active: #1e3a5f; --chip-active-ink: #8cbcf7; --chip-wait: #3d3a1e; --chip-wait-ink: #e0c86a;
      --chip-ok: #1c3b26; --chip-ok-ink: #7fdc9c; --chip-bad: #4a2424; --chip-bad-ink: #f3a39b;
      --chip: #2a2f36; --chip-ink: #b9c0c8; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
    svg.i { width: 16px; height: 16px; fill: currentColor; flex: none; display: block; }

    /* header */
    header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px;
             display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 6px; }
    h1 svg { width: 22px; height: 22px; fill: var(--accent); }
    .hstats { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
    .hstats b { color: var(--text); font-weight: 600; }
    .disk { display: flex; align-items: center; gap: 6px; }
    .disk .bar { width: 80px; height: 6px; }
    .engine-down { color: var(--bad); font-weight: 600; }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
           border-radius: 7px; padding: 6px 10px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .btn:hover { border-color: var(--faint); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: var(--bad); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.ghost:hover { background: var(--panel2); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.icon { padding: 6px; }

    /* add */
    #add { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
           display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
    #add.drag { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    #add textarea { grid-column: 1 / -1; width: 100%; resize: vertical; min-height: 42px; max-height: 40vh;
                    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; background: var(--bg); }
    #add .opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    #add input[type=text] { border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--bg); width: 170px; }
    #add .go { align-self: center; }
    label.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

    /* tabs + toolbar */
    nav#tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    nav#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px;
                      color: var(--muted); cursor: pointer; white-space: nowrap; }
    nav#tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    nav#tabs .n { font-size: 11.5px; color: var(--faint); margin-left: 3px; }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 0; flex-wrap: wrap; }
    .toolbar input[type=search], .toolbar select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; background: var(--panel); }
    .toolbar input[type=search] { flex: 1; min-width: 160px; }

    /* bulk bar */
    #bulk { position: sticky; top: 56px; z-index: 4; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
            background: var(--panel); border: 1px solid var(--accent); border-radius: 9px; padding: 7px 9px; margin-bottom: 8px; box-shadow: var(--shadow); }
    #bulk .count { font-weight: 600; margin-right: 4px; }

    /* rows */
    #list { display: flex; flex-direction: column; gap: 6px; }
    .row { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px 8px; }
    .row.sel { border-color: var(--accent); }
    .row.hidden-job { opacity: .6; }
    .r1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .r1 input[type=checkbox] { margin: 0; width: 16px; height: 16px; flex: none; }
    .star { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); }
    .star.on { color: var(--star); }
    .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-weight: 500; }
    .name:hover { text-decoration: underline; }
    .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); white-space: nowrap; flex: none; }
    .chip.active { background: var(--chip-active); color: var(--chip-active-ink); }
    .chip.waiting, .chip.paused { background: var(--chip-wait); color: var(--chip-wait-ink); }
    .chip.complete { background: var(--chip-ok); color: var(--chip-ok-ink); }
    .chip.error, .chip.stopped { background: var(--chip-bad); color: var(--chip-bad-ink); }
    .chip.cat { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .acts { display: flex; gap: 2px; flex: none; }
    .bar { height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--accent); transition: width .6s; }
    .row[data-status=complete] .fill { background: var(--ok); }
    .row[data-status=error] .fill, .row[data-status=stopped] .fill { background: var(--bad); }
    .row[data-status=paused] .fill, .row[data-status=waiting] .fill { background: var(--warn); }
    .r2 { margin: 7px 0 5px 24px; }
    .r3 { margin-left: 24px; display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .errline { margin: 4px 0 0 24px; font-size: 12px; color: var(--bad); overflow-wrap: anywhere; }
    .gone { color: var(--faint); font-style: italic; }
    .details { margin: 8px 0 2px 24px; padding: 8px 10px; background: var(--panel2); border-radius: 7px;
               display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; }
    .details dt { color: var(--muted); }
    .details dd { margin: 0; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .details code { font-size: 12px; }
    .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }

    /* menus, dialogs, toasts */
    .menu { position: fixed; z-index: 20; min-width: 210px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 9px; box-shadow: var(--shadow); padding: 4px; }
    .menu button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; border: 0; background: none;
                   padding: 7px 9px; border-radius: 6px; cursor: pointer; }
    .menu button:hover { background: var(--panel2); }
    .menu button.danger { color: var(--bad); }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
    dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
             box-shadow: var(--shadow); padding: 18px; width: min(440px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(10, 14, 20, .45); }
    dialog h2 { font-size: 16px; margin: 0 0 10px; }
    dialog p { margin: 0 0 12px; color: var(--muted); overflow-wrap: anywhere; }
    dialog .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    dialog .field span { font-size: 12.5px; color: var(--muted); }
    dialog input[type=text], dialog input[type=password], dialog input[type=number], dialog select {
      border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: var(--bg); width: 100%; }
    dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px;
              max-width: min(420px, calc(100vw - 32px)); }
    .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
             border-radius: 8px; padding: 9px 12px; box-shadow: var(--shadow); font-size: 13px; overflow-wrap: anywhere;
             white-space: pre-line; }
    .toast.bad { border-left-color: var(--bad); }
    .toast.ok { border-left-color: var(--ok); }

    #empty { color: var(--faint); text-align: center; padding: 40px 0; }

    /* connections */
    #conns { font-size: 12.5px; }
    #conns p { color: var(--muted); }
    #conns .tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
    #conns table { width: 100%; border-collapse: collapse; }
    #conns th, #conns td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    #conns th { color: var(--muted); font-weight: 500; }
    #conns td { overflow-wrap: anywhere; }
    #conns td.nw { white-space: nowrap; }
    #conns tr.deny .ev, #conns tr.error .ev { color: var(--bad); }
    #conns tr.open .ev, #conns tr.close .ev { color: var(--accent); }

    @media (max-width: 640px) {
      header { gap: 8px; position: static; }
      .hstats { order: 5; width: 100%; }
      .hide-sm { display: none !important; }
      #add { grid-template-columns: 1fr; }
      #add .go { justify-self: stretch; justify-content: center; }
      #bulk { top: 8px; }
      .r2, .r3, .errline, .details { margin-left: 0; }
      .details { grid-template-columns: 1fr; }
      .details dt { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><svg viewBox="0 0 24 24"><path d="M11 3h2v10l4-4 1.4 1.4L12 16.8 5.6 10.4 7 9l4 4zM5 19h14v2H5z"/></svg>Fetcher</h1>
      <div class="hstats" id="hstats"></div>
      <div class="spacer"></div>
      <button class="btn ghost" id="pauseAll" title="Pause all"></button>
      <button class="btn ghost" id="resumeAll" title="Resume all"></button>
      <button class="btn ghost icon" id="openSettings" title="Settings"></button>
    </header>

    <form id="add" autocomplete="off">
      <textarea name="urls" rows="1" spellcheck="false" placeholder="Paste or drop links (https:// or http://) - one per line. Enter adds, Shift+Enter for a new line."></textarea>
      <div class="opts">
        <label>Folder <input type="text" name="category" list="cats" placeholder="(main folder)" maxlength="64"></label>
        <datalist id="cats"></datalist>
        <label class="check"><input type="checkbox" name="paused"> Add paused</label>
        <span id="addHint"></span>
      </div>
      <button class="btn primary go" type="submit"></button>
    </form>

    <nav id="tabs"></nav>

    <div class="toolbar" id="toolbar">
      <label class="check" title="Select all shown"><input type="checkbox" id="selAll"></label>
      <input type="search" id="search" placeholder="Search name, link or folder  ( / )">
      <select id="catFilter" title="Folder"></select>
      <select id="sort" title="Sort">
        <option value="added">Newest first</option>
        <option value="added-asc">Oldest first</option>
        <option value="name">Name</option>
        <option value="size">Largest first</option>
        <option value="progress">Progress</option>
        <option value="status">Status</option>
      </select>
      <label class="check"><input type="checkbox" id="showHidden"> Show hidden <span id="hiddenCount" class="n"></span></label>
      <button class="btn ghost" id="clearDone" title="Remove all completed downloads from the list (files are kept)">Clear completed</button>
    </div>

    <div id="bulk" hidden></div>
    <div id="list"></div>
    <div id="empty" hidden></div>

    <section id="conns" hidden>
      <p>Every connection the download engine attempted, newest first. It has no other route out, so nothing is missing from this list.</p>
      <div class="tw"><table>
        <thead><tr><th>Time</th><th>Event</th><th>Host</th><th>IP</th><th>Data</th><th>Detail</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

  <script src="app.js"></script>
</body>
</html>
