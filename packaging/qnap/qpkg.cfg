# QTS registration for the Fetcher Docker stack.
# https://github.com/qnap-dev/QDK (base template reference)

QPKG_NAME="fetcher"
QPKG_DISPLAY_NAME="Fetcher"
QPKG_VER="0.1.0"
QPKG_AUTHOR="IterativeKey"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Resumable, multi-connection download manager (aria2 + API + UI)"

QPKG_RC_NUM="101"

# Start/stop buttons in App Center are wired to this script (installed in shared/)
QPKG_SERVICE_PROGRAM="fetcher.sh"
QPKG_SERVICE_PORT="5142"

# Web UI registration in QTS
QPKG_WEBUI="/"
QPKG_WEB_PORT="5142"
# Also reachable through QTS's own HTTP port: http://NAS:8080/fetcher
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/fetcher"

# Open in an iFrame window on the QTS desktop instead of a new tab
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1178"
QPKG_DESKTOP_APP_WIN_HEIGHT="600"

# 1 = administrators (see qpkg.cfg template for options)
QPKG_VISIBLE="1"
QTS_MINI_VERSION="4.1.0"

# Self-distributed (no PGM App Center update feed)
QPKG_DISTRIBUTION_TYPE="1"
